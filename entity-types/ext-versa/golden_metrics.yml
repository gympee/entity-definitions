cpuUtilization:
  title: CPU utilization (%)
  unit: PERCENTAGE
  queries:
    kentik:
      select: vaApplHealth.cpuload # does this need average()? latest() seems problematic - https://github.com/gympee/entity-definitions/blob/main/docs/entities/golden_metrics.md#further-explanation
      from: VersaApplHealthSample

memoryUtilization:
  title: Memory utilization (%)
  unit: PERCENTAGE
  queries:
    kentik:
      select: vaApplHealth.memload
      from: VersaApplHealthSample

# assumes an update to Nordstrom Versa SNMP profile to include activeSessions
deviceActiveSessions:
  title: Active sessions
  unit: COUNT
  queries:
    # Versa devices from Kentik (ktranslate)
    kentik/versa: # how/where is this defined?
      select: vaApplHealth.sessload
      from: VersaApplHealthSample
