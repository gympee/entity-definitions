cpuUtilization:
  title: CPU utilization (%)
  unit: PERCENTAGE
  queries:
    jwn-versa:
      select: versa.cpu_load
      from: Metric

memoryUtilization:
  title: Memory utilization (%)
  unit: PERCENTAGE
  queries:
    jwn-versa:
      select: versa.memory_load
      from: Metric

deviceActiveSessions:
  title: Active sessions
  unit: COUNT
  queries:
    jwn-versa:
      select: versa.session_load
      from: Metric
