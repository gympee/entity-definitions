cpuUtilization:
  title: CPU utilization (%)
  unit: PERCENTAGE
  queries:
    kentik:
      select: latest(vaApplHealth.cpuload)
      from: VersaApplHealthSample

memoryUtilization:
  title: Memory utilization (%)
  unit: PERCENTAGE
  queries:
    kentik:
      select: latest(vaApplHealth.memload)
      from: VersaApplHealthSample

# assumes an update to Nordstrom Versa SNMP profile to include activeSessions
deviceActiveSessions:
  title: Active sessions
  unit: COUNT
  queries:
    # Versa devices from Kentik (ktranslate)
    kentik/versa: # how/where is this defined?
      select: latest(vaApplHealth.sessload)
      from: VersaApplHealthSample
