cpuUtilization:
  title: CPU utilization (%)
  unit: PERCENTAGE
  queries:
    jwn-versa:
      select: versa.appliance.cpu_load_percent
      from: Metric

memoryUtilization:
  title: Memory utilization (%)
  unit: PERCENTAGE
  queries:
    jwn-versa:
      select: versa.appliance.memory_load_percent
      from: Metric

deviceActiveSessions:
  title: Active sessions
  unit: COUNT
  queries:
    jwn-versa:
      select: versa.appliance.session_load_percent
      from: Metric
