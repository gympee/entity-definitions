domain: EXT
type: VERSA
synthesis:
  rules:
  # Versa devices from Kentik (ktranslate)
  - identifier: device_name
    name: device_name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: provider
      value: kentik-versa # identified in Nordstrom's versa snmp profile
    tags:
      src_addr:
        entityTagName: device_ip
        multiValue: false
      tags.container_service:
        entityTagName: container_service
        multiValue: false
    # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
    prefixedTags:
      tags.:
        ttl: PT4H
  # Versa devices from JWN Metrics ETL process
  - identifier: device_name
    name: device_name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: provider
      value: jwn-versa # identified in Nordstrom's Metrics ETL process
    tags:
      src_addr:
        entityTagName: device_ip
        multiValue: false
    # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
    prefixedTags:
      tags.:
        ttl: PT4H
  # Versa devices from ETL processes
  - identifier: device_name
    name: device_name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      prefix: Versa
  tags: # these are very Nordstrom specific
    location:
    env:
    app_id:
    team_id:
    tier:

dashboardTemplates:
  newRelic:
    template: dashboard.json

configuration:
  entityExpirationTime: DAILY
  alertable: true
